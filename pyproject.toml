[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-lab-mlx"
version = "0.1.0"
description = "Quantization and KL-divergence evaluation with MLX. For learning purposes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlx",
    "mlx-lm",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pre-commit",
]

[tool.setuptools]
# Only the library package is installed; quantize.py / evaluate.py are run as scripts.
packages = ["quant_lab"]

[tool.ruff]
line-length = 100
# target Python version is inferred from requires-python

[tool.ruff.lint]
select = [
    "E", "F",   # pycodestyle errors + pyflakes (unused imports, undefined names)
    "I",        # import sorting
    "B",        # bugbear: likely bugs (mutable default args, etc.)
    "UP",       # modernize syntax for your Python version
    "NPY",      # NumPy-specific checks
    "SIM",      # simplifications
]

[tool.pytest.ini_options]
testpaths = ["tests"]
