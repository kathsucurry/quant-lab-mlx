[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-lab-mlx"
version = "0.1.0"
description = "Quantization and KL-divergence evaluation with MLX. For learning purposes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlx==0.32.4",
    "mlx-lm @ git+https://github.com/ml-explore/mlx-lm@736ab0d8c1d0edc79c3d798044fe6904e2fa23be",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pre-commit",
]

[project.scripts]
qlab = "quant_lab.cli:main"

[tool.setuptools]
# Everything, including the `qlab` CLI (quant_lab/cli.py), lives in this package.
packages = ["quant_lab"]

[tool.ruff]
line-length = 100
# target Python version is inferred from requires-python

[tool.ruff.lint]
select = [
    "E", "F",   # pycodestyle errors + pyflakes (unused imports, undefined names)
    "I",        # import sorting
    "B",        # bugbear: likely bugs (mutable default args, etc.)
    "UP",       # modernize syntax for your Python version
    "NPY",      # NumPy-specific checks
    "SIM",      # simplifications
]

[tool.pytest.ini_options]
testpaths = ["tests"]
